version: "3.9"

networks:
    app-network:
        driver: bridge 
    
services:
    postgres:
        image: postgres:16
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: fleet-flux-java
            POSTGRES_USER: fleet-flux
            POSTGRES_PASSWORD: fleet-flux-password
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init:/docker-entrypoint-initdb.d
        ports:
            - "${DB_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U fleet-flux -d fleet-flux-java"]
            interval: 10s
            timeout: 5s
            retries: 5
            
    keycloak:
        image: quay.io/keycloak/keycloak:26.7
        container_name: keycloak
        restart: unless-stopped
        networks:
            - app-network
        ports:
            - "${KEYCLOAK_PORT:-8081}:8080"
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HEALTH_ENABLED: "true"
            KC_HTTP_ENABLED: "true"
            KC_HOSTNAME_STRICT: "false"
        depends_on:
            - mailpit
        healthcheck:
            test: ["CMD-SHELL", "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; cat; } 0<>/dev/tcp/127.0.0.1/9000"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 10s
        command:
            - start-dev

    keycloak-init:
        image: quay.io/keycloak/keycloak:26.7
        container_name: keycloak-init
        networks:
            - app-network
        depends_on:
            keycloak:
                condition: service_healthy
        environment:
            KEYCLOAK_MASTER_CLIENT_SECRET: "${KEYCLOAK_MASTER_CLIENT_SECRET:-test-secret}"
        volumes:
            - ./scripts/keycloak-dev-init.sh:/init.sh:ro
        entrypoint: [ "/bin/bash", "/init.sh" ]
        restart: "no"

    keycloak-test:
        image: quay.io/keycloak/keycloak:26.7
        command: start-dev
        container_name: keycloak-test
        networks:
            - app-network
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HEALTH_ENABLED: "true"
        ports:
            - "${KEYCLOAK_TEST_PORT:-8180}:8080"
        healthcheck:
            test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
            interval: 5s
            timeout: 5s
            retries: 30

    keycloak-test-init:
        image: quay.io/keycloak/keycloak:26.7
        container_name: keycloak-test-init
        networks:
          - app-network
        depends_on:
            keycloak-test:
                condition: service_healthy
        volumes:
            - ./scripts/keycloak-it-test-init.sh:/init.sh:ro
        entrypoint: ["/bin/bash", "/init.sh"]
        restart: "no"

    mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit
        ports:
            - "${MAILPIT_WEB_PORT:-8025}:8025" # Web UI
            - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
        networks:
            - app-network

    # One-shot: builds the OSRM routing data inside Docker if it does not exist yet.
    osrm-init:
        build: ./docker/osrm
        image: fleet-flux-osrm-tools
        container_name: osrm-init
        environment:
            OSRM_DATASET: "${OSRM_DATASET:-portugal-spain}"
            OSRM_REGIONS: "${OSRM_REGIONS:-portugal spain}"
        volumes:
            - osrm_data:/data
            - ./scripts/osrm-init.sh:/init.sh:ro
        entrypoint: ["/bin/bash", "/init.sh"]
        restart: "no"

    osrm:
        image: ghcr.io/project-osrm/osrm-backend:latest
        container_name: osrm
        restart: unless-stopped
        networks:
            - app-network
        ports:
            - "${OSRM_PORT:-5001}:5000"
        volumes:
            - osrm_data:/data:ro
        depends_on:
            osrm-init:
                condition: service_completed_successfully
        command: osrm-routed --algorithm mld --port 5000 /data/${OSRM_DATASET:-portugal-spain}.osrm

volumes:
    osrm_data:
    postgres_data:
                        