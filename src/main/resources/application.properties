%dev.quarkus.http.port=8080

quarkus.swagger-ui.path=/docs
quarkus.smallrye-openapi.security-scheme=oauth2
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer

quarkus.tls.key-store.pem.0.cert=certs/server.crt
quarkus.tls.key-store.pem.0.key=certs/server.key
quarkus.tls.trust-store.pem.certs=certs/ca.crt

quarkus.http.ssl-port=8443

#quarkus.http.insecure-requests=disabled

# "request" asks for a cert but doesn't demand one
quarkus.http.ssl.client-auth=request
quarkus.http.auth.certificate-role-properties=cert-role-mappings.properties

quarkus.keycloak.devservices.enabled=false

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=fleet-flux
%dev.quarkus.datasource.password=fleet-flux-password
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fleet-flux-java
#quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.flyway.migrate-at-start=true
# todo - remove this
quarkus.flyway.baseline-on-migrate=true

# Allow Quarkus Dev Services to start PostgreSQL automatically.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.datasource.db-kind=postgresql
# Fail if the migrated schema doesn't match the entity mappings.
%test.quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

%dev.quarkus.keycloak.admin-client.realm=master
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8081
%dev.quarkus.keycloak.admin-client.client-id=master-admin
%dev.quarkus.keycloak.admin-client.client-secret=test-secret
%dev.quarkus.keycloak.default-web-client-name=web

quarkus.hibernate-orm.multitenant=DISCRIMINATOR

quarkus.http.test-port=8095

quarkus.keycloak.smpt-server.host=mailpit
quarkus.keycloak.smpt-server.port=1025
quarkus.keycloak.smpt-server.from=no-reply@fleet-flux.com
quarkus.keycloak.smpt-server.auth=false
quarkus.keycloak.smpt-server.starttls=false

quarkus.super-admin.realm=fleet-flux-admin
quarkus.super-admin.hostname=admin
quarkus.super-admin.username=superadmin
quarkus.super-admin.email=superadmin@fleet-flux.com
quarkus.super-admin.password=superadmin
quarkus.super-admin.first-name=Super
quarkus.super-admin.last-name=Admin

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/http?:\/\/(?:[^.]+\.)?localhost:5173/,http://127.0.0.1:8765
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE

quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

%dev.quarkus.rest-client.osrm-api.url=http://localhost:5001

quarkus.test.integration-test-profile=it
%it.quarkus.datasource.db-kind=postgresql
%it.quarkus.datasource.username=testing
%it.quarkus.datasource.password=testing
%it.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/fleet-flux-java-testing

%it.quarkus.flyway.migrate-at-start=true
%it.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%it.quarkus.keycloak.admin-client.realm=master
%it.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%it.quarkus.keycloak.admin-client.client-id=my-admin-client-test
%it.quarkus.keycloak.admin-client.client-secret=test-secret
%it.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
