quarkus.swagger-ui.path=/docs
quarkus.smallrye-openapi.security-scheme=oauth2
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=fleet-flux
%dev.quarkus.datasource.password=fleet-flux-password
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fleet-flux-java
#quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.flyway.migrate-at-start=true
# todo - remove this
quarkus.flyway.baseline-on-migrate=true

# Allow Quarkus Dev Services to start PostgreSQL automatically.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
# Fail if the migrated schema doesn't match the entity mappings.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
#%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fleet-flux-java-testing

quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.keycloak.admin-client.enabled=true
quarkus.keycloak.admin-client.server-url=http://localhost:8081
quarkus.keycloak.admin-client.realm=master
quarkus.keycloak.admin-client.client-id=master-admin
quarkus.keycloak.admin-client.client-secret=KEYCLOAK_MASTER_ADMIN_SECRET
quarkus.keycloak.admin-client.grant-type=password
quarkus.keycloak.default-web-client-name=web

quarkus.http.test-port=8085

quarkus.keycloak.smpt-server.host=mailpit
quarkus.keycloak.smpt-server.port=1025
quarkus.keycloak.smpt-server.from=no-reply@fleet-flux.com
quarkus.keycloak.smpt-server.auth=false
quarkus.keycloak.smpt-server.starttls=false

quarkus.super-admin.realm=fleet-flux-admin
quarkus.super-admin.hostname=admin
quarkus.super-admin.username=superadmin
quarkus.super-admin.email=superadmin@fleet-flux.com
quarkus.super-admin.password=superadmin
quarkus.super-admin.first-name=Super
quarkus.super-admin.last-name=Admin

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/http?:\/\/(?:[^.]+\.)?localhost:5173/
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE

quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
